<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reckless Drivin'</title>
<link rel="icon" href="icon.png">
<style>
	:root {
		--bg: #000;
		--fg: #ece6da;
		--muted: #9a948a;
		--accent: #e8442e;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		background: var(--bg);
		color: var(--fg);
		font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	body { overflow: hidden; }
	#stage {
		position: relative;
		width: 100vw;
		height: 100dvh;
		display: flex;
		align-items: center;
		justify-content: center;
		overflow: hidden;
		background: var(--bg);
	}
	/* The game renders 640x480; scale it up as large as fits, keeping 4:3,
	   with crisp pixels like the desktop build. */
	canvas {
		display: block;
		width: min(100vw, calc(100dvh * 4 / 3));
		aspect-ratio: 4 / 3;
		image-rendering: pixelated;
		outline: none;
	}
	#overlay {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		padding: 16px;
		background: radial-gradient(circle at center, #2a1613 0%, #000 75%);
		text-align: center;
	}
	#overlay img { width: 96px; height: 96px; image-rendering: auto; }
	#overlay h1 {
		margin: 0;
		font-size: clamp(28px, 6vw, 48px);
		letter-spacing: .04em;
		color: var(--fg);
	}
	#status { color: var(--muted); min-height: 1.4em; }
	progress {
		width: min(60%, 320px);
		accent-color: var(--accent);
	}
	button {
		font: inherit;
		font-weight: 600;
		padding: 10px 28px;
		border: 0;
		border-radius: 999px;
		background: var(--accent);
		color: #fff;
		cursor: pointer;
	}
	button:disabled { opacity: .4; cursor: default; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
	<div id="stage">
		<canvas id="canvas" width="640" height="480" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
		<div id="overlay">
			<img src="icon.png" alt="">
			<h1>Reckless Drivin'</h1>
			<progress id="progress" max="1" value="0"></progress>
			<div id="status">Downloading…</div>
			<button id="play" disabled>Play</button>
		</div>
	</div>

<script>
	const stage = document.getElementById("stage");
	const canvas = document.getElementById("canvas");
	const overlay = document.getElementById("overlay");
	const statusEl = document.getElementById("status");
	const progressEl = document.getElementById("progress");
	const playButton = document.getElementById("play");

	// Fullscreen shortcuts (same keys as the desktop build). Fullscreen can only
	// be requested from inside the browser's key handler, so handle them here,
	// before SDL sees the key, and keep the browser's own F11 from firing.
	window.addEventListener("keydown", (e) => {
		const isF11 = e.code === "F11";
		const isAltEnter = e.code === "Enter" && e.altKey;
		if (!isF11 && !isAltEnter) return;
		e.preventDefault();
		e.stopImmediatePropagation();
		if (e.repeat) return;
		if (document.fullscreenElement) {
			document.exitFullscreen();
		} else {
			stage.requestFullscreen().catch(() => {});
		}
	}, true);

	canvas.addEventListener("webglcontextlost", (e) => {
		e.preventDefault();
		showError("The WebGL context was lost. Reload the page to continue.");
	});

	function showError(text) {
		overlay.hidden = false;
		progressEl.hidden = true;
		playButton.hidden = true;
		statusEl.textContent = text;
	}

	var Module = {
		canvas,
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
		preRun: [() => {
			// SDL_GetPrefPath() lives under /libsdl; back it with IndexedDB so
			// preferences, high scores and lap records survive a reload.
			Module.FS.mkdir("/libsdl");
			Module.FS.mount(Module.IDBFS, {}, "/libsdl");
			Module.addRunDependency("syncfs");
			Module.FS.syncfs(true, (err) => {
				if (err) console.warn("Loading saved preferences failed:", err);
				Module.removeRunDependency("syncfs");
			});
		}],
		setStatus(text) {
			// Emscripten reports download progress as "Downloading data... (x/y)"
			const m = text.match(/\((\d+(?:\.\d+)?)\/(\d+)\)/);
			if (m) {
				progressEl.value = parseInt(m[1]) / parseInt(m[2]);
				statusEl.textContent = `Downloading… ${(parseInt(m[2]) / 1048576).toFixed(1)} MB`;
			} else if (text) {
				statusEl.textContent = text;
			}
		},
		onRuntimeInitialized() {
			progressEl.hidden = true;
			statusEl.textContent = "Ready";
			playButton.disabled = false;
			playButton.focus();
		},
		onAbort(what) {
			showError("The game crashed: " + what);
		},
		onExit(code) {
			showError(code === 0 ? "Thanks for playing! Reload the page to play again." : "The game exited with an error.");
		},
	};

	// Starting from a click also lets the browser unlock audio
	playButton.addEventListener("click", () => {
		overlay.hidden = true;
		canvas.focus();
		Module.callMain([]);
	});

	window.addEventListener("error", (e) => showError("Error: " + e.message));
</script>
{{{ SCRIPT }}}
</body>
</html>
